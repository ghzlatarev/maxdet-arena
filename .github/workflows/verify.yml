name: exact-verification

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "submissions/**"
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: exact-verification-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      touches-submissions: ${{ steps.paths.outputs.touches-submissions }}
    steps:
      - name: Classify changed paths without checking out head code
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "${EVENT_NAME}" == "push" ]]; then
            echo 'touches-submissions=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename' > "${RUNNER_TEMP}/changed-paths.txt"
          if rg -q '^submissions/' "${RUNNER_TEMP}/changed-paths.txt"; then
            echo 'touches-submissions=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'touches-submissions=false' >> "${GITHUB_OUTPUT}"
          fi

  trusted-repository:
    needs: classify-pr
    if: >-
      (github.event_name == 'push' || github.event_name == 'pull_request') &&
      needs.classify-pr.outputs.touches-submissions == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run exact tests
        run: ./arena test --verbose
      - name: Reproduce trusted receipts
        run: python3 tools/verify_repository.py
      - name: Compile and cross-check research starters
        run: |
          mkdir -p build/research runs/ci
          c++ -std=c++20 -O2 -Wall -Wextra -Werror \
            research/fast_search.cpp -o build/research/fast_search
          build/research/fast_search \
            --start references/orrick-et-al-2003/matrix.txt \
            --output runs/ci/fast.matrix.txt \
            --log runs/ci/fast.jsonl \
            --mode block \
            --seed 23 \
            --seconds 0.1
          ./arena verify runs/ci/fast.matrix.txt --quiet
          c++ -std=c++20 -O2 -Wall -Wextra -Werror \
            research/pair_search.cpp -o build/research/pair_search
          build/research/pair_search \
            --start references/orrick-et-al-2003/matrix.txt \
            --output runs/ci/pair.matrix.txt \
            --log runs/ci/pair.jsonl \
            --seed 23 \
            --seconds 0.01
          ./arena verify runs/ci/pair.matrix.txt --quiet

  website:
    needs: classify-pr
    if: >-
      (github.event_name == 'push' || github.event_name == 'pull_request') &&
      needs.classify-pr.outputs.touches-submissions == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check website
        run: npm run typecheck
      - name: Build website
        run: npm run build
      - name: Build GitHub Pages export
        run: npm run build:pages

  untrusted-submission:
    needs: classify-pr
    if: >-
      github.event_name == 'pull_request_target' &&
      needs.classify-pr.outputs.touches-submissions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out untrusted head as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: untrusted
          persist-credentials: false
      - name: Verify with base-branch code only
        working-directory: trusted
        run: >-
          python3 tools/verify_pr.py
          --untrusted-root "${GITHUB_WORKSPACE}/untrusted"
