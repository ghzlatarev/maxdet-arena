name: exact-verification

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: exact-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trusted-repository:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run exact tests
        run: ./arena test --verbose
      - name: Reproduce trusted receipts
        run: python3 tools/verify_repository.py

  untrusted-submission:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out untrusted head as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: untrusted
          persist-credentials: false
      - name: Verify with base-branch code only
        working-directory: trusted
        run: >-
          python3 tools/verify_pr.py
          --untrusted-root "${GITHUB_WORKSPACE}/untrusted"
