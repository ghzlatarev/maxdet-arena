name: exact-verification

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: exact-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trusted-repository:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run exact tests
        run: ./arena test --verbose
      - name: Reproduce trusted receipts
        run: python3 tools/verify_repository.py
      - name: Compile and cross-check research starters
        run: |
          mkdir -p build/research runs/ci
          c++ -std=c++20 -O2 -Wall -Wextra -Werror \
            research/fast_search.cpp -o build/research/fast_search
          build/research/fast_search \
            --start references/orrick-et-al-2003/matrix.txt \
            --output runs/ci/fast.matrix.txt \
            --log runs/ci/fast.jsonl \
            --mode block \
            --seed 23 \
            --seconds 0.1
          ./arena verify runs/ci/fast.matrix.txt --quiet
          c++ -std=c++20 -O2 -Wall -Wextra -Werror \
            research/pair_search.cpp -o build/research/pair_search
          build/research/pair_search \
            --start references/orrick-et-al-2003/matrix.txt \
            --output runs/ci/pair.matrix.txt \
            --log runs/ci/pair.jsonl \
            --seed 23 \
            --seconds 0.01
          ./arena verify runs/ci/pair.matrix.txt --quiet

  website:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check website
        run: npm run typecheck
      - name: Build website
        run: npm run build

  untrusted-submission:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out untrusted head as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: untrusted
          persist-credentials: false
      - name: Verify with base-branch code only
        working-directory: trusted
        run: >-
          python3 tools/verify_pr.py
          --untrusted-root "${GITHUB_WORKSPACE}/untrusted"
